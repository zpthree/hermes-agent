name: Sync upstream Hermes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-hermes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Merge and verify upstream
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge upstream
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

          upstream_sha=$(git rev-parse upstream/main)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.merge.outputs.changed == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Run customized API-server regression suite
        id: tests
        if: steps.merge.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-upstream-sync
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          uv run --locked --python 3.11 --extra dev --with aiohttp==3.14.3 pytest -q \
            tests/gateway/test_api_server_runs.py \
            tests/gateway/test_api_server_sse_keepalive.py \
            tests/gateway/test_api_server.py

      - name: Push verified upstream merge
        id: push
        if: steps.merge.outputs.changed == 'true' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report blocked synchronization
        if: always() && (steps.merge.outcome == 'failure' || steps.merge.outputs.conflict == 'true' || (steps.merge.outputs.changed == 'true' && steps.push.outcome != 'success'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          MERGE_CONFLICT: ${{ steps.merge.outputs.conflict }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          title="Automated upstream Hermes sync needs attention"
          body=$(cat <<EOF
          The scheduled upstream synchronization could not safely update main.

          - Upstream commit: ${UPSTREAM_SHA}
          - Merge-step outcome: ${MERGE_OUTCOME}
          - Merge conflict: ${MERGE_CONFLICT}
          - Regression-test outcome: ${TEST_OUTCOME:-not-run}
          - Push outcome: ${PUSH_OUTCOME:-not-run}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The fork was not pushed. Resolve the merge or failing tests, then rerun the workflow.
          EOF
          )
          issue=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

      - name: Close resolved synchronization issue
        if: steps.push.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated upstream Hermes sync needs attention"
          issue=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Upstream synchronization succeeded in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
